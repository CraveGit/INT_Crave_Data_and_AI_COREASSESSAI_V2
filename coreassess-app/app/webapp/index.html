<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CoreAssess v2</title>
    <!-- Explicit icon so the browser uses this app-served file instead of
         auto-requesting /favicon.ico at the approuter root (which 503s: the
         approuter only proxies the html5 app, not a root favicon). -->
    <link rel="icon" type="image/png" href="image/favico.png" />
    <link rel="shortcut icon" type="image/png" href="image/favico.png" />
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "com.crave.coreassessv2": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="com.crave.coreassessv2"
        data-id="container"
        data-settings='{"id" : "com.crave.coreassessv2"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
